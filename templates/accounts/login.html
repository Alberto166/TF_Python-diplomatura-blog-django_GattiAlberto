{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Blog Python{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Iniciar Sesión</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                </form>
                <hr>
                <p class="text-center mb-0">¿No tenés cuenta? <a href="{% url 'register' %}">Registrate acá</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
